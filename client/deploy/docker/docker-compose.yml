services:
  postgres:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: n2n-portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: n2n_portal
      POSTGRES_USER: n2n
      POSTGRES_PASSWORD: n2n_local_password
    ports:
      - "5433:5432"
    volumes:
      - n2n_postgres_data:/var/lib/postgresql/data
      - ../migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n2n -d n2n_portal"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: n2n_local_password
    volumes:
      - ../migration:/migration:ro
    command: >
      sh -c "psql -h postgres -U n2n -d n2n_portal -f /migration/001_schema.sql"
    restart: "no"

volumes:
  n2n_postgres_data:
